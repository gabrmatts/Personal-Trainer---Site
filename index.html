<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma Fitness Premium</title>
    <link rel="stylesheet" href="src/style.css">
    <!-- Font Awesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonte Google: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <section class="hero-section">
        <!-- Vídeo de Fundo -->
        <video autoplay loop muted playsinline class="background-video">
            <source src="video/Video Promo (1).mp4" type="video/mp4">
            Seu navegador não suporta vídeos HTML5.
        </video>
        
        <!-- Gradiente escuro para melhorar a leitura -->
        <div class="video-overlay"></div>

        <!-- Cabeçalho Fixo com Efeito Blur (Glassmorphism) -->
        <header class="header glass-menu" id="main-header">
            <div class="logo">
                <img src="img/Sabrina Personal - logo reta.png" alt="Logo da Empresa" class="logo-img">
            </div>
            
            <!-- Menu Desktop -->
            <nav class="nav-menu">
                <a href="#inicio"><i class="fa-solid fa-house"></i> Início</a>
                <a href="#planos"><i class="fa-solid fa-bolt"></i> Planos</a>
                <a href="#duvidas"><i class="fa-solid fa-circle-info"></i> Dúvidas</a>
            </nav>

            <!-- Botão substituído (Aparece só no PC) -->
            <button class="btn-header desktop-only" onclick="conhecerPlanos()">
                <i class="fa-solid fa-tags"></i> Conhecer Planos
            </button>

            <!-- Botão Menu Mobile (Hambúrguer) -->
            <div class="menu-toggle" id="mobile-menu-btn">
                <i class="fa-solid fa-bars"></i>
            </div>
        </header>

        <!-- Menu Lateral (Mobile) -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <img src="img/Sabrina Personal.png" alt="Logo da Empresa" class="logo-img">
                </div>
                <i class="fa-solid fa-xmark close-btn" id="close-menu-btn"></i>
            </div>
            <nav class="sidebar-nav">
                <a href="#inicio" onclick="fecharMenuMobile()"><i class="fa-solid fa-house"></i> Início</a>
                <a href="#planos" onclick="fecharMenuMobile()"><i class="fa-solid fa-bolt"></i> Planos</a>
                <a href="#duvidas" onclick="fecharMenuMobile()"><i class="fa-solid fa-circle-info"></i> Dúvidas</a>
            </nav>
            <button class="btn-sidebar" onclick="conhecerPlanos()">
                <i class="fa-solid fa-tags"></i> Conhecer Planos
            </button>
        </div>

        <!-- Conteúdo Central com animações de entrada -->
        <main class="hero-content">
            <div class="top-tags fade-in-up delay-1">
                <span class="tag-text">Brasil: top 1 de hoje</span>
                <span class="tag-green">99% de satisfação</span>
                <span class="tag-age">18+</span>
            </div>

            <h1 class="main-title fade-in-up delay-2">
                A maior plataforma<br>fitness do Brasil. Feita para<br>mulheres reais.
            </h1>
            
            <button class="btn-primary fade-in-up delay-3" onclick="comecarTransformacao()">
                <i class="fa-solid fa-dumbbell"></i> Comece agora a sua transformação
            </button>

            <!-- Prova Social -->
            <div class="social-proof fade-in-up delay-4">
                <div class="avatars">
                    <img src="https://i.pravatar.cc/100?img=1" alt="Aluna">
                    <img src="https://i.pravatar.cc/100?img=5" alt="Aluna">
                    <img src="https://i.pravatar.cc/100?img=9" alt="Aluna">
                    <img src="https://i.pravatar.cc/100?img=12" alt="Aluna">
                    <img src="https://i.pravatar.cc/100?img=16" alt="Aluna">
                </div>
                <p class="social-text">Junte-se a mais de <strong>90 mil alunas</strong><br>que já transformaram suas vidas.</p>
            </div>
        </main>
    </section>

    <script src="script.js"></script>
</body>
</html>
